<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2d5a3d" />
    <meta name="description" content="Book stays, events and tickets at Grand Gala Gardens." />
    <!-- PWA: installable home-screen app (vite-plugin-pwa injects the manifest link and service
         worker registration at build time). These cover iOS Safari, which ignores the manifest's
         own icons list for "Add to Home Screen". -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="GG Connect" />
    <!-- The app's one font: Plus Jakarta Sans (tailwind-tokens.ts), upright 400–800 + italic 400–500. preconnect makes it load sooner. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500&display=swap" rel="stylesheet" />
    <title>grand-gala-gardens</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
